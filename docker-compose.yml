
services:
  backend:
    build:
      context: ./backend
    container_name: otel-backend
    restart: unless-stopped
    expose:
      - "4000"

  frontend:
    build:
      context: ./frontend
    container_name: otel-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - otel-collector

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: otel-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    restart: unless-stopped
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./otel-collector/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:latest
    container_name: otel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:latest
    container_name: otel-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger

volumes:
  grafana-data:
